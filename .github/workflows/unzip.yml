name: Unzip Project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ لم يتم العثور على ZIP"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unzip
        run: |
          mkdir extracted
          unzip -o "$ZIP" -d extracted

          INNER=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$INNER" ]; then
            SOURCE="$INNER"
          else
            SOURCE="extracted"
          fi

          # نسخ كل الملفات ما عدا GitHub Workflows
          rsync -av \
            --exclude=".github/workflows/" \
            "$SOURCE"/ ./

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Unzip project"

      - name: Push changes
        run: |
          git push
